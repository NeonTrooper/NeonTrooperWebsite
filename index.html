<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Konstantinos Lyveras · Portfolio Boy</title>
  <meta name="description" content="Konstantinos Lyveras, software developer. Portfolio as a playable Game Boy-style handheld, in English and Greek.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <!-- Pixel fonts from Google Fonts.
       Press Start 2P = the chunky "Game Boy" headings (has Greek letters too)
       VT323          = the readable body text for English
       Tiny5          = the readable body text for Greek (VT323 has no Greek letters) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Tiny5&display=swap">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!--
    PAGE STRUCTURE
    ==============
    .stage   centres everything and gives the 3D perspective
    .rig     the 3D box that gets rotated when you drag it
               .console (front face) = the Game Boy you interact with
               .face.back/left/right/top/bottom = the other five sides of the box
    #screen  the 320x288 "LCD" panel. Everything you see on the screen is
             drawn into this div by js/app.js.
    .legend  the small help text under the console
  -->
  <div class="stage">
    <div class="rig" id="rig" aria-label="3D handheld console, drag to rotate">

    <!-- FRONT FACE: the console itself -->
    <div class="console face front" aria-label="Handheld console showing Konstantinos Lyveras's portfolio">

      <!-- The dark frame around the screen -->
      <div class="bezel">
        <div class="stripes"></div>
        <div class="bezel-text">DOT MATRIX WITH STEREO SOUND</div>
        <div class="led"><i></i>BATTERY</div>

        <!-- The green screen. #screen is filled by JavaScript. -->
        <div class="lcd"><div id="screen" role="application" aria-live="polite"></div></div>
      </div>

      <!-- Printed logo under the screen -->
      <div class="brand">Konstantinos Lyveras<span>PORTFOLIO BOY</span></div>

      <!-- Physical buttons. Every button has a data-btn value; app.js listens
           for clicks/taps on anything with class "btn" and reads that value. -->
      <div class="dpad" aria-label="Directional pad">
        <div class="k up btn" data-btn="up" role="button" tabindex="0" aria-label="Up"></div>
        <div class="k down btn" data-btn="down" role="button" tabindex="0" aria-label="Down"></div>
        <div class="k left btn" data-btn="left" role="button" tabindex="0" aria-label="Left"></div>
        <div class="k right btn" data-btn="right" role="button" tabindex="0" aria-label="Right"></div>
        <div class="c"></div>
      </div>

      <div class="ab">
        <div class="round b btn" data-btn="b" role="button" tabindex="0" aria-label="B button"></div>
        <div class="round a btn" data-btn="a" role="button" tabindex="0" aria-label="A button"></div>
        <span class="lab b">B</span><span class="lab a">A</span>
      </div>

      <div class="ss">
        <div class="pill btn" data-btn="select" role="button" tabindex="0" aria-label="Select"><div class="cap"></div><span class="lab">SELECT</span></div>
        <div class="pill btn" data-btn="start" role="button" tabindex="0" aria-label="Start"><div class="cap"></div><span class="lab">START</span></div>
      </div>

      <!-- Speaker grille (decoration only) -->
      <div class="speaker"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    </div>

    <!-- THE OTHER FIVE FACES OF THE BOX (decoration only, seen when you rotate it) -->
    <div class="face back" aria-hidden="true">
      <div class="screws"><i></i><i></i><i></i><i></i></div>
      <div class="plate">
        <div class="model">PORTFOLIO BOY</div>
        <div class="fine">MODEL NO. KL-2019 · SOFTWARE DEVELOPER EDITION<br>DESIGNED IN CHAIDARI, ATTIKI · SERIAL 2026-0908<br>RUNS ON HTML · CSS · JAVASCRIPT</div>
      </div>
      <div class="battery"><span>◀ OPEN</span><div class="ridges"></div></div>
    </div>
    <div class="face side left" aria-hidden="true"><i class="ext"></i><i class="dial"></i><b>CONTRAST</b></div>
    <div class="face side right" aria-hidden="true"><i class="dial"></i><b>VOLUME</b></div>
    <div class="face side top" aria-hidden="true"><i class="sw"></i><i class="slot"></i></div>
    <div class="face side bottom" aria-hidden="true"><i class="jack"></i><b>PHONES</b></div>

    </div><!-- /.rig -->

    <!-- Soft shadow on the "floor" under the console -->
    <div class="floor-shadow" aria-hidden="true"></div>

    <!-- Help text. Filled by app.js so it can switch language. -->
    <p class="legend" id="legend"></p>
  </div>

  <!-- Order matters: data.js defines the content (window.PB),
       app.js reads it and runs the whole thing. -->
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
